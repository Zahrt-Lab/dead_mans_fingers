name: CI

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # Daily at 6:00 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (excluding hardware)
        run: pytest test/ -m "not hardware" -v --tb=short

      - name: Smoke test simulation run (1 analog, 3 trials)
        run: python main.py test/test_config_ci_smoke.json --simulation
